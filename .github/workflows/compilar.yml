name: Compilar Readnex

# Todos los días revisa si ArtCraft publicó una versión nueva y, si la hay, la compila y publica.
# También se puede ejecutar a mano (Actions → Compilar Readnex → Run workflow).
on:
  schedule:
    - cron: "49 9 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Versión original (vacío: la última)"
        type: string
        default: ""
      publicar:
        description: "Publicar la versión"
        type: boolean
        default: true
      forzar:
        description: "Compilar aunque ya esté publicada"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  actualizar:
    uses: jacnexstudio/jacnex-build/.github/workflows/actualizar.yml@main
    with:
      proyecto: pdfcraft
      upstream: storytold/pdfcraft
      nombre: Readnex
      ref: ${{ inputs.ref }}
      publicar: ${{ github.event_name == 'schedule' || inputs.publicar }}
      forzar: ${{ inputs.forzar == true }}
